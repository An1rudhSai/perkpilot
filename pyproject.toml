[project]
name = "perkpilot"
version = "0.1.0"
description = "Agent that turns credit-card benefit terms into cited, structured rules and answers card questions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["perkpilot*"]

[tool.setuptools.package-data]
perkpilot = ["terms/*.txt", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
